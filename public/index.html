<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #172033; background: #f3f6fb; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px 16px; }
      main { max-width: 860px; margin: auto; }
      h1 { margin-bottom: 6px; }
      .subtitle { color: #607087; margin-top: 0; }
      .panel { background: white; border: 1px solid #e0e7f0; border-radius: 12px; padding: 22px; margin: 20px 0; box-shadow: 0 5px 18px #1720330b; }
      form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
      label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
      input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 7px; font: inherit; }
      button { padding: 10px 14px; border: 0; border-radius: 7px; background: #2456d3; color: white; font: inherit; cursor: pointer; }
      button.secondary { background: #64748b; }
      button.danger { background: #c03948; }
      .actions { display: flex; gap: 7px; }
      .message { min-height: 20px; color: #b42332; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 12px 10px; border-bottom: 1px solid #e6ebf2; text-align: left; }
      th { color: #607087; font-size: 13px; }
      @media (max-width: 560px) { body { padding: 20px 10px; } .panel { padding: 14px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Student Management</h1>
      <p class="subtitle">A simple Node.js CRUD app for a DevOps lab demo.</p>
      <section class="panel">
        <h2 id="form-title">Add a student</h2>
        <form id="student-form">
          <label>Name <input name="name" required maxlength="100"></label>
          <label>Email <input name="email" type="email" required maxlength="200"></label>
          <label>Course <input name="course" required maxlength="100"></label>
          <div class="actions">
            <button id="save-button" type="submit">Add student</button>
            <button id="cancel-button" class="secondary" type="button" hidden>Cancel</button>
          </div>
        </form>
        <p id="message" class="message" role="status"></p>
      </section>
      <section class="panel">
        <h2>Students</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Course</th><th>Actions</th></tr></thead>
            <tbody id="student-list"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      const form = document.querySelector("#student-form");
      const list = document.querySelector("#student-list");
      const message = document.querySelector("#message");
      let editingId = null;

      async function api(url, options = {}) {
        const response = await fetch(url, options);
        if (!response.ok) {
          const result = await response.json();
          throw new Error(result.error || "Request failed.");
        }
        return response.status === 204 ? null : response.json();
      }

      function resetForm() {
        editingId = null;
        form.reset();
        document.querySelector("#form-title").textContent = "Add a student";
        document.querySelector("#save-button").textContent = "Add student";
        document.querySelector("#cancel-button").hidden = true;
      }

      async function loadStudents() {
        try {
          const students = await api("/api/students");
          list.replaceChildren();
          for (const student of students) {
            const row = document.createElement("tr");
            for (const value of [student.name, student.email, student.course]) {
              const cell = document.createElement("td");
              cell.textContent = value;
              row.append(cell);
            }

            const actions = document.createElement("td");
            const buttons = document.createElement("div");
            buttons.className = "actions";
            const edit = document.createElement("button");
            edit.type = "button";
            edit.textContent = "Edit";
            edit.className = "secondary";
            edit.addEventListener("click", () => {
              editingId = student.id;
              form.elements.name.value = student.name;
              form.elements.email.value = student.email;
              form.elements.course.value = student.course;
              document.querySelector("#form-title").textContent = "Edit student";
              document.querySelector("#save-button").textContent = "Save changes";
              document.querySelector("#cancel-button").hidden = false;
              message.textContent = "";
            });
            const remove = document.createElement("button");
            remove.type = "button";
            remove.textContent = "Delete";
            remove.className = "danger";
            remove.addEventListener("click", async () => {
              if (!confirm(`Delete ${student.name}?`)) return;
              try {
                await api(`/api/students/${student.id}`, { method: "DELETE" });
                await loadStudents();
                message.textContent = "Student deleted.";
              } catch (error) {
                message.textContent = error.message;
              }
            });
            buttons.append(edit, remove);
            actions.append(buttons);
            row.append(actions);
            list.append(row);
          }
        } catch (error) {
          message.textContent = error.message;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const student = Object.fromEntries(new FormData(form));
        const isEditing = editingId !== null;
        try {
          await api(isEditing ? `/api/students/${editingId}` : "/api/students", {
            method: isEditing ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(student)
          });
          resetForm();
          message.textContent = isEditing ? "Student updated." : "Student added.";
          await loadStudents();
        } catch (error) {
          message.textContent = error.message;
        }
      });

      document.querySelector("#cancel-button").addEventListener("click", resetForm);
      loadStudents();
    </script>
  </body>
</html>
